name: Release

# Builds both editions and attaches the PDFs to a GitHub Release.
# Triggered by pushing a version tag:
#
#   git tag -a v0.1.0 -m "Skeleton and Program F1"
#   git push origin v0.1.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Compile ${{ matrix.lang }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - lang: en
            pdf: Mathematics-from-Zero-for-the-AI-Engineer
          - lang: pl
            pdf: Matematyka-od-zera-dla-inzyniera-AI
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --quiet numpy sympy

      - name: Recompute every number, and refuse to release on drift
        run: |
          make numbers
          # TWO failures, and `git diff` alone can only see the first: drift in a
          # tracked file, and a file git has NEVER SEEN -- which is the state
          # every program's first values file is in, so it used to pass this
          # gate by being invisible to it.
          #
          # TWO DIRECTORIES, and this was scoped to figures/values alone until
          # F03 added a console transcript. A transcript is a printed number
          # inside a verbatim block: the same promise, the same script, and for
          # one program it sat outside every drift gate in the repository.
          drift=$(git diff --name-only -- figures/values figures/transcripts)
          new=$(git ls-files --others --exclude-standard -- figures/values figures/transcripts)
          if [ -n "$drift" ] || [ -n "$new" ]; then
            echo "::error::Refusing to release: a printed number differs from its script, or figures/values or figures/transcripts carries a file git has never seen."
            [ -n "$drift" ] && git diff -- figures/values figures/transcripts
            [ -n "$new" ] && { echo "Untracked, never compared to anything:"; echo "$new"; }
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Render diagrams
        run: |
          shopt -s nullglob
          SRC=(figures/mermaid/*/*.mmd)
          [ ${#SRC[@]} -eq 0 ] && exit 0
          printf '{"args":["--no-sandbox","--disable-dev-shm-usage"]}\n' > .puppeteer.json
          for f in "${SRC[@]}"; do
            lang=$(basename "$(dirname "$f")"); key=$(basename "$f" .mmd)
            mkdir -p "figures/diagrams/$lang"
            npx -y @mermaid-js/mermaid-cli@11 \
              -i "$f" -o "figures/diagrams/$lang/$key.pdf" \
              -p .puppeteer.json -c figures/mermaid/config.json \
              -b transparent --pdfFit
          done

      - name: Compile with latexmk
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main-${{ matrix.lang }}.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Fail on unresolved references
        run: |
          if grep -q "Reference.*undefined" main-${{ matrix.lang }}.log; then
            echo "::error::Refusing to release with unresolved cross-references."
            grep "Reference.*undefined" main-${{ matrix.lang }}.log | sort -u
            exit 1
          fi

      - name: Name the artefact after the tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mv main-${{ matrix.lang }}.pdf "${{ matrix.pdf }}-${TAG}.pdf"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.lang }}
          path: '*.pdf'

  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    permissions:
      contents: write        # scoped to this job only, not the whole workflow
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: '*.pdf'
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
