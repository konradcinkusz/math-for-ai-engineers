name: KDP

# THE ADDITIVITY GUARD, and a call to the volume build. The interiors
# themselves moved to volumes.yml, which release.yml calls from the same `v*`
# tag that publishes the book -- so there is no longer a `kdp-v*` tag, and no
# longer a second release path producing something different.
#
# What is left here is the question a pull request has to answer: has the KDP
# work changed the four PDFs a reader actually gets? That is what `regression`
# compiles the trade edition twice to find out, and it gates everything after it.
#
# It does not run on every push. A volume build is eight compiles of a book, and
# the thing it validates -- the interior against Amazon's requirements -- only
# matters when somebody is about to upload one, or cut a release.

on:
  workflow_dispatch:
    inputs:
      # Both of these were declared and then ignored: the matrix read
      # `[en, pl]` and the scope job's own output whatever was typed here, so
      # asking for one language built two and asking for volume 2 built three.
      # `scope' below parses them now, and volumes.yml's matrix reads them.
      langs:
        description: 'en, pl, or both'
        default: 'both'
      volumes:
        description: 'comma-separated volume numbers, or all'
        default: 'all'
  # The regression guard's whole job is to prove the four existing PDFs have
  # not moved, and the moment that claim is made is a pull request -- so it
  # runs here too. How much else runs is DECIDED BY THE DIFF rather than by the
  # event: `scope' below builds all four volumes when a file every volume reads
  # has changed and volume III alone otherwise. This comment used to say the
  # matrix was always cut to one volume, which was true when it was written and
  # was made false by `scope' in the same commit that added it -- and it is
  # exactly the arrangement that let a volume I defect through a green PR.
  pull_request:
    paths:
      - 'kdp/**'
      - 'tools/volumes.json'
      - 'tools/gen_volumes.py'
      - 'tools/test_gen_volumes.py'
      - 'tools/kdp*.py'
      - 'tools/checkkdp.py'
      - 'tools/checkxvol.py'
      - '.github/workflows/kdp.yml'
      - '.github/workflows/volumes.yml'
      - 'preamble.tex'
      - 'lang/*.tex'

permissions:
  contents: read

concurrency:
  group: kdp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # THE GUARD. The KDP work is additive or it is a defect, and "additive" is a
  # claim about the four existing PDFs rather than about the diff. This builds
  # the trade edition on the merge base and on HEAD and fails if the page count
  # or the resolved cross-reference list moved by so much as one entry.
  #
  # It gates everything else, because a volume that is correct at the cost of
  # the book it came from is not worth having.
  # -------------------------------------------------------------------------
  regression:
    name: The existing editions have not moved
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install --quiet numpy sympy

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Render diagrams
        run: |
          shopt -s nullglob
          SRC=(figures/mermaid/*/*.mmd)
          [ ${#SRC[@]} -eq 0 ] && { mkdir -p figures/diagrams; exit 0; }
          printf '{"args":["--no-sandbox","--disable-dev-shm-usage"]}\n' > .puppeteer.json
          npm install -g @mermaid-js/mermaid-cli@11
          for f in "${SRC[@]}"; do
            lang=$(basename "$(dirname "$f")"); key=$(basename "$f" .mmd)
            mkdir -p "figures/diagrams/$lang"
            timeout 180 mmdc -i "$f" -o "figures/diagrams/$lang/$key.pdf" \
              -p .puppeteer.json -c figures/mermaid/config.json \
              -b transparent --pdfFit \
              || { echo "::error file=$f::failed to render $lang/$key"; exit 1; }
          done

      # The cheapest form of the guard, and it runs before two book compiles.
      # The page-count comparison below catches the EFFECT of touching a shared
      # file; this catches the cause in a second, and names the file.
      #
      # release.yml CAME OFF THIS LIST when the release path was unified, and
      # the reasoning matters more than the edit. The list is the four PDFs'
      # own sources plus the two workflows that are theirs alone -- build.yml,
      # which proves they compile on every push, and pages.yml, which publishes
      # them. release.yml is neither any more: one `v*' tag now attaches the
      # four editions AND the eight interiors, so it is shared ground, and a
      # rule forbidding the volume path to touch it would forbid the volumes
      # reaching a reader at all. What that gives up is small and worth naming:
      # release.yml compiles the same four formats build.yml does, on every
      # pull request, so a KDP change that broke them there would be red long
      # before a tag -- and the volumes reach release.yml through one `uses:'
      # line naming volumes.yml, which is this side of the list by design.
      # pages.yml was NOT on the list and publishes the four PDFs, which was a
      # hole in the same fence; it is on it now.
      - name: No KDP change may touch the files the four PDFs are made of
        run: |
          BASE=$(git merge-base HEAD "origin/${{ github.event.repository.default_branch }}") \
            || { echo "::error::cannot find the merge base; refusing to guess one"; exit 1; }
          echo "base = $BASE"
          BAD=$(git diff --name-only "$BASE"...HEAD | grep -E \
            '^(main-(en|pl)(-a4)?\.tex|body\.tex|structure\.tex|preamble\.tex|\.github/workflows/(build|pages)\.yml)$' \
            || true)
          if [ -n "$BAD" ]; then
            echo "::error::the KDP path is additive and these are not its to change:"
            echo "$BAD" | sed 's/^/::error::  /'
            exit 1
          fi
          echo "Nothing this path may not change is in this diff."
          echo "MFA_BASE=$BASE" >> "$GITHUB_ENV"

      - name: Compile the trade edition at HEAD
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main-en.tex
          args: -pdf -interaction=nonstopmode -file-line-error

      - name: Record HEAD's page count and cross-references
        run: |
          # apt-get update refreshes EVERY repository the runner image has
          # configured and fails on any one of them -- and under `bash -e' that
          # ends the job. This workflow installs from Ubuntu's own archive and
          # from nothing else, and one of the third-party repositories the image
          # ships preconfigured, Google's Chrome repo, failed this pull request
          # mid-publish:
          #
          #   E: Failed to fetch .../chrome-stable/.../Packages.gz
          #      Hash Sum mismatch
          #      Release file created at:    Wed, 09 Sep 2026 17:16:59 +0000
          #      Last modification reported: Wed, 09 Sep 2026 09:41:12 +0000
          #
          # -- an index and a Release file disagreeing for as long as a publish
          # takes, on a service this repository does not touch. Every diagram had
          # already rendered; the job died installing two packages.
          #
          # SO LET THE INSTALL DECIDE, which is the question actually being
          # asked. If the package is obtainable the step proceeds; if it is not,
          # apt names the PACKAGE it cannot find rather than the index it could
          # not refresh. `flake' is not a root cause and this is not a retry:
          # the step no longer fails on a condition that does not stop it doing
          # its job. The warning keeps a real apt outage visible in the log.
          #
          # The same three lines are at the two other apt sites in this file,
          # and in volumes.yml, which these jobs moved to. build.yml, pages.yml
          # and release.yml carry it too and are not touched from here.
          sudo apt-get update -qq \
            || echo "::warning::apt-get update failed; the install below decides"
          sudo apt-get install -y -qq poppler-utils
          mkdir -p /tmp/head
          pdfinfo main-en.pdf | awk '/^Pages/{print $2}' > /tmp/head/pages
          # NOT reflist.py, which stood here and answered a different question.
          # reflist compares the two EDITIONS against each other and prints a
          # COUNT, so two builds differing by a moved \ref produce identical
          # output; and this job compiles main-en only, so it failed on the
          # absent main-pl.aux on BOTH sides and the diff below compared two
          # error strings whose sole difference was the absolute path each tree
          # sat at. Had the paths matched it would have gone green having
          # compared nothing. auxrefs.py dumps label -> number for ONE tree and
          # refuses an empty answer. No `|| true`: a guard that cannot read its
          # evidence has none, and must stop rather than compare two blanks.
          python3 tools/auxrefs.py . > /tmp/head/refs
          echo "HEAD: $(cat /tmp/head/pages) pages, $(wc -l < /tmp/head/refs) labels"

      # The merge base, built from the same diagrams, so only the source differs.
      #
      # NOT /tmp. latex-action is a DOCKER action, and its `docker run` mounts
      # the workspace and /home/runner and nothing else, so a working_directory
      # under /tmp is invisible inside the container: it answered
      # "File 'main-en.tex' cannot be found from the directory '/tmp/base'" and
      # the guard proving the four existing PDFs had not moved failed on its own
      # scaffolding rather than on the book. $RUNNER_TEMP is under /home/runner
      # and is mounted at the SAME path, which also keeps the worktree's .git
      # file -- an absolute pointer back into the real repository -- resolvable
      # on both sides of the mount.
      - name: Compile the trade edition at the merge base
        run: |
          # $MFA_BASE, set by the path check above. NOT `|| git rev-parse HEAD~1`,
          # which is what stood here: if origin/<default> were unavailable the
          # guard would quietly compare HEAD against its own previous commit and
          # pass, proving nothing about the four existing PDFs. A guard that
          # weakens itself in silence is worse than one that stops.
          test -n "$MFA_BASE" || { echo "::error::no merge base"; exit 1; }
          git worktree add "$RUNNER_TEMP/base" "$MFA_BASE"
          for d in diagrams values transcripts; do
            cp -r "figures/$d" "$RUNNER_TEMP/base/figures/" 2>/dev/null || true
          done
          test -f "$RUNNER_TEMP/base/main-en.tex" \
            || { echo "::error::the base worktree has no main-en.tex"; exit 1; }

      - name: Compile the base
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: ${{ runner.temp }}/base
          root_file: main-en.tex
          args: -pdf -interaction=nonstopmode -file-line-error

      - name: The two must agree
        run: |
          B=$(pdfinfo "$RUNNER_TEMP/base/main-en.pdf" | awk '/^Pages/{print $2}')
          H=$(cat /tmp/head/pages)
          echo "base $B pages, head $H pages"
          if [ "$B" != "$H" ]; then
            echo "::error::main-en moved from $B to $H pages. The KDP work is"
            echo "::error::additive: the four existing PDFs must not change."
            exit 1
          fi
          # And the cross-references, which a page count cannot see: a \ref
          # can resolve to a different program with the page total unmoved.
          # The base tree is a worktree of an OLDER commit and does not contain
          # auxrefs.py, so HEAD's copy is POINTED AT it rather than run inside
          # it -- which is why the script takes its tree root as an argument.
          python3 "$GITHUB_WORKSPACE/tools/auxrefs.py" "$RUNNER_TEMP/base" > /tmp/base-refs
          echo "base $(wc -l < /tmp/base-refs) labels, head $(wc -l < /tmp/head/refs) labels"
          if ! diff -q /tmp/base-refs /tmp/head/refs >/dev/null 2>&1; then
            echo "::error::a cross-reference resolves differently than on the base"
            diff /tmp/base-refs /tmp/head/refs | head -30 || true
            exit 1
          fi
          echo "The trade edition is unchanged: same page count, same references."

  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # WHICH VOLUMES THIS DIFF HAS TO BE PROVED ON.
  #
  # A pull request used to build volume III alone, on the argument that eight
  # compiles of a book is a release cost and a smoke test is what a PR needs.
  # That argument is right about a change to ONE volume's content and wrong
  # about a change to what every volume reads -- and the difference cost a red
  # tag build: kdp/preamble-kdp.tex gained a frame-room guard, the PR proved it
  # on volume III, and volume I English stranded a frame opener that nobody saw
  # until `kdp-v1.0.0` built all eight.
  #
  # So the rule is the narrow one rather than "always build eight": a diff that
  # touches a file every volume reads builds every volume, and anything else
  # keeps the smoke test. The matrix cannot be computed inside `strategy`, so it
  # is an output here.
  # -------------------------------------------------------------------------
  scope:
    name: Which volumes this diff needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [regression]
    outputs:
      volumes: ${{ steps.pick.outputs.volumes }}
      langs: ${{ steps.pick.outputs.langs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: pick
        # Through the environment rather than interpolated into the script: a
        # dispatch input is somebody's typing, and typing interpolated into a
        # shell is typing that can run one.
        env:
          IN_LANGS: ${{ github.event.inputs.langs }}
          IN_VOLS: ${{ github.event.inputs.volumes }}
        run: |
          set -euo pipefail

          # The languages. Only a dispatch ever narrows them, and until this
          # job parsed the input the matrix read `[en, pl]` whatever was typed.
          case "${IN_LANGS:-both}" in
            en)      LANGS='["en"]' ;;
            pl)      LANGS='["pl"]' ;;
            both|"") LANGS='["en", "pl"]' ;;
            *) echo "::error::langs is en, pl or both; got '$IN_LANGS'"; exit 1 ;;
          esac
          echo "langs=$LANGS" >> "$GITHUB_OUTPUT"
          echo "::notice::languages $LANGS"

          # A dispatch asks for volumes by number, and the numbers are CHECKED
          # AGAINST THE MANIFEST rather than passed through. A matrix built from
          # a volume that does not exist runs zero jobs and reports success,
          # which is the shape of failure this repository keeps recording: the
          # tool accepted the input and returned a plausible answer.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VOLS=$(python3 -c '
          import json, sys
          known = [v["n"] for v in json.load(open("tools/volumes.json"))["volumes"]]
          s = sys.argv[1].strip()
          want = known if s in ("", "all") else [int(x) for x in s.split(",") if x.strip()]
          bad = [n for n in want if n not in known]
          if not want or bad:
              sys.exit(f"volumes {bad or want} are not in the manifest, which has {known}")
          print(json.dumps(want))' "${IN_VOLS:-all}")
            echo "volumes=$VOLS" >> "$GITHUB_OUTPUT"
            echo "::notice::a dispatch asked for volumes $VOLS."
            exit 0
          fi

          BASE=$(git merge-base HEAD "origin/${{ github.event.repository.default_branch }}") \
            || { echo "::error::cannot find the merge base; refusing to guess one"; exit 1; }
          # Everything below is read by all eight builds, so a change to it is
          # only proved by all eight. kdpstage.py and kdpbuild.py are here for
          # the same reason the preamble is: this pipeline has already shipped
          # one defect in each of them that volume III did not exhibit.
          # volumes.yml joined them when the build moved into it -- the matrix
          # the eight interiors are compiled from is in that file now.
          SHARED='^(kdp/preamble-kdp\.tex|kdp/.*\.tex|tools/kdpbuild\.py|tools/kdpstage\.py|tools/gen_volumes\.py|tools/volumes\.json|tools/checkkdp\.py|\.github/workflows/volumes\.yml)$'
          if git diff --name-only "$BASE"...HEAD | grep -qE "$SHARED"; then
            echo 'volumes=[1, 2, 3, 4]' >> "$GITHUB_OUTPUT"
            echo "::notice::this diff touches a file every volume reads, so all four are built."
          else
            echo 'volumes=[3]' >> "$GITHUB_OUTPUT"
            echo "::notice::no shared KDP file in this diff; volume III is the smoke test."
          fi

  # -------------------------------------------------------------------------
  # AND THE BUILD ITSELF, which is no longer in this file. volumes.yml is called
  # from here and from release.yml, so a pull request and a `v*` tag compile the
  # same eight interiors through the same steps -- which is the whole of what
  # separating a `kdp-v*` tag from a `v*` one used to cost.
  #
  # The archive is worth keeping only when there is a full set to keep: a pull
  # request that built volume III as a smoke test has already been told what it
  # needed to know by the checks inside the matrix.
  # -------------------------------------------------------------------------
  volumes:
    name: Interiors
    needs: [scope]
    uses: ./.github/workflows/volumes.yml
    with:
      volumes: ${{ needs.scope.outputs.volumes }}
      langs: ${{ needs.scope.outputs.langs }}
      bundle: ${{ needs.scope.outputs.volumes != '[3]' }}
