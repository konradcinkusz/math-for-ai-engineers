name: Build

# Validates both editions on every push and pull request. The release workflow
# only runs on tags and is therefore too late to catch a broken pull request;
# this is the one that gives contributors feedback.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # The numbers come first, and they gate everything. If a script no longer
  # produces the value the book prints, nothing downstream is worth building.
  # -------------------------------------------------------------------------
  numbers:
    name: Recompute every number
    runs-on: ubuntu-latest
    # `make numbers` is well under a minute on a laptop and the slowest single
    # script in it is P05's twenty-three seconds. Without a ceiling a hung job
    # sits on GitHub's six-hour default reporting nothing at all, which is
    # what happened once and cost most of an afternoon: every other job was
    # green, this one said "in progress", and there was no signal to act on.
    # A timeout turns that into a failure somebody can read.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --quiet numpy sympy
      - name: Regenerate figures/values from code/
        run: make numbers
      - name: Fail if any committed value has drifted
        run: |
          # TWO failures, and `git diff` alone can only see the first: drift in a
          # tracked file, and a file git has NEVER SEEN -- which is the state
          # every program's first values file is in, so it used to pass this
          # gate by being invisible to it.
          #
          # TWO DIRECTORIES, and this was scoped to figures/values alone until
          # F03 added a console transcript. A transcript is a printed number
          # inside a verbatim block: the same promise, the same script, and for
          # one program it sat outside every drift gate in the repository.
          drift=$(git diff --name-only -- figures/values figures/transcripts)
          new=$(git ls-files --others --exclude-standard -- figures/values figures/transcripts)
          if [ -n "$drift" ] || [ -n "$new" ]; then
            echo "::error::A computed value differs from what code/ now produces, or figures/values or figures/transcripts carries a file git has never seen."
            [ -n "$drift" ] && git diff -- figures/values figures/transcripts
            [ -n "$new" ] && { echo "Untracked, never compared to anything:"; echo "$new"; }
            exit 1
          fi
          echo "Every computed value in the book matches its script."
      # Both directories, so the compile jobs get the transcripts as well as
      # the values. With two paths the artefact is rooted at their least
      # common ancestor, figures/, which is why the download below unpacks
      # into figures/ and not into figures/values/.
      - uses: actions/upload-artifact@v4
        with:
          name: values
          path: |
            figures/values
            figures/transcripts
          retention-days: 14
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Parity is a hard gate. A bilingual book fails by having a correction
  # applied to one edition and missed in the other; this is what stops that.
  # -------------------------------------------------------------------------
  parity:
    name: Polish and English in step
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: The manifest and the tree agree
        run: python3 tools/gen_stubs.py --check

      - name: Compare the two editions
        run: python3 tools/parity.py

      # Every \transcript{} names a file that is there. The macro's own
      # fallback prints a marker and BUILDS, which is how ten of the book's
      # twelve listings went nine programs without reaching a page with every
      # other gate green -- so this has to be checked in the source, before
      # the build, rather than looked for in a log that says nothing about it.
      - name: Every transcript is on the page
        run: python3 tools/check_structure.py --scripts

      # Appendix D names a Polish rendering for every English term it lists,
      # and a row naming a word the book does not use is a claim about the
      # body that is false. It reads the PROSE of programs/pl, because a
      # substring count over raw LaTeX counts a \label and a \val key as
      # usage -- which is how an audit of this appendix twice licensed a row
      # for a word the prose never writes.
      - name: Every glossary rendering is used in the prose
        run: python3 tools/check_structure.py --terms

      - name: The introduction's map matches the manifest
        run: python3 tools/check_structure.py --parts

  diagrams:
    name: Render diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render every Mermaid source to PDF
        run: |
          shopt -s nullglob
          SRC=(figures/mermaid/*/*.mmd)
          if [ ${#SRC[@]} -eq 0 ]; then
            echo "No Mermaid sources yet."
            mkdir -p figures/diagrams
            exit 0
          fi
          # mermaid-cli bundles its own Chromium; --no-sandbox is required in a
          # container running as root.
          printf '{"args":["--no-sandbox","--disable-dev-shm-usage"]}\n' > .puppeteer.json
          # Install once rather than resolving the package on every diagram.
          # There are well over a hundred sources and the count grows by about
          # six per program, so a per-diagram `npx -y` was paying the
          # resolution cost that many times.
          npm install -g @mermaid-js/mermaid-cli@11
          FAILED=0
          for f in "${SRC[@]}"; do
            lang=$(basename "$(dirname "$f")")
            key=$(basename "$f" .mmd)
            mkdir -p "figures/diagrams/$lang"
            echo "::group::$lang/$key"
            # A PER-RENDER TIMEOUT, for the reason the job-level one exists.
            # A headless Chromium that wedges takes the whole 25-minute job
            # budget with it and reports nothing about WHICH diagram wedged,
            # which is indistinguishable from a slow queue -- the exact defect
            # `timeout-minutes` was added to every job to remove, one level
            # down. Measured: this job renders every source in about four
            # minutes, so 180 seconds for one diagram is not a tight bound,
            # it is a hang.
            if ! timeout 180 mmdc \
                 -i "$f" -o "figures/diagrams/$lang/$key.pdf" \
                 -p .puppeteer.json -c figures/mermaid/config.json \
                 -b transparent --pdfFit; then
              rc=$?
              if [ $rc -eq 124 ]; then
                echo "::error file=$f::Mermaid TIMED OUT rendering $lang/$key"
              else
                echo "::error file=$f::Mermaid failed to render $lang/$key"
              fi
              FAILED=1
            fi
            echo "::endgroup::"
          done
          exit $FAILED
      - name: Both languages must carry the same diagram keys
        run: |
          a=$(cd figures/mermaid/en 2>/dev/null && ls *.mmd 2>/dev/null | sort || true)
          b=$(cd figures/mermaid/pl 2>/dev/null && ls *.mmd 2>/dev/null | sort || true)
          if [ "$a" != "$b" ]; then
            echo "::error::The two editions have different diagram sets."
            diff <(echo "$a") <(echo "$b") || true
            exit 1
          fi
          echo "Diagram keys match across both editions."
      - uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: figures/diagrams
          retention-days: 14
          if-no-files-found: ignore

  # Two languages times two paper formats. The A4 pair is not a cosmetic extra:
  # a format change moves every page boundary, and a table that fits on one page
  # in the trade format can overflow its vbox on A4 without the trade build
  # noticing. Compiling only one format would let that ship.
  build:
    name: Compile ${{ matrix.lang }} (${{ matrix.fmt }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [numbers, diagrams]
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: en
            fmt: standard
            job: main-en
            pdf: Mathematics-from-Zero-for-the-AI-Engineer
          - lang: pl
            fmt: standard
            job: main-pl
            pdf: Matematyka-od-zera-dla-inzyniera-AI
          - lang: en
            fmt: a4
            job: main-en-a4
            pdf: Mathematics-from-Zero-for-the-AI-Engineer-A4
          - lang: pl
            fmt: a4
            job: main-pl-a4
            pdf: Matematyka-od-zera-dla-inzyniera-AI-A4
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: values
          path: figures

      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: diagrams
          path: figures/diagrams

      - name: Compile with latexmk
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ matrix.job }}.tex
          latexmk_use_lualatex: false
          # pdflatex is sufficient; the preamble degrades gracefully when the
          # optional font packages are missing.
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      # Not `grep '^!' main.log`. With -file-line-error an error line begins
      # with a path, and -interaction=nonstopmode writes a PDF over the top of
      # it, so both the exit code and the PDF say "fine". A broken
      # \IfFileExists branch stopped siunitx loading in a build everybody
      # believed was green, and the decimal comma silently did not work.
      - name: Check the log properly
        run: python3 tools/checklog.py ${{ matrix.job }}.log

      # And check the ARTEFACT. A frame opener stranded at the foot of a page
      # produces no error, no warning and no overfull box, so the log cannot
      # see it -- and the badge it strands is the book's navigation device.
      - name: Check the PDF for stranded frame openers
        run: |
          command -v pdftotext >/dev/null 2>&1 || \
            sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          python3 tools/checkpdf.py --cues=warn ${{ matrix.job }}.pdf

      # if: always(), so it must survive a cancelled or failed compile that
      # left no log behind -- a reporting step that fails because there is
      # nothing to report turns one red job into two.
      #
      # It calls tools/checklog.py rather than counting boxes inline: one
      # implementation of "did this build actually succeed", used by CI and by
      # `make check` alike. A second copy in YAML would drift from it.
      - name: Report the build
        if: always()
        continue-on-error: true
        run: |
          LOG="${{ matrix.job }}.log"
          if [ ! -f "$LOG" ]; then
            echo "### \`${{ matrix.lang }}\` edition, ${{ matrix.fmt }}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_No log — the compile did not run to completion._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### \`${{ matrix.lang }}\` edition, ${{ matrix.fmt }}"
            echo ""
            echo '```'
            python3 tools/checklog.py "$LOG" || true
            echo '```'
            echo ""
            echo "_An overfull **vbox** is the expensive one: a boxed block grew"
            echo "past a page and could not break. Split the table; do not shrink"
            echo "the text._"
          } >> "$GITHUB_STEP_SUMMARY"

      # And when a vbox does fire, TeX's own words, verbatim. checklog.py says
      # how much and where; this says what TeX was doing at the time -- the
      # shipout markers and the file it had open immediately before the
      # complaint. A vbox that survives three glue changes without moving by a
      # tenth of a point is a vbox whose location the analysis has got wrong,
      # and at that point the raw log is worth more than another inference.
      - name: What TeX said around each overfull vbox
        if: always()
        run: |
          grep -n -B 24 -A 2 'Overfull \\vbox' "${{ matrix.job }}.log" \
            | tail -160 || echo "no overfull vbox in this log"

      # The LOG, and it must be `if: always()`, because the only run whose log
      # anybody wants is the one that failed. checklog.py reads the log and
      # then the log is thrown away, so a failure visible ONLY on this machine
      # -- an overfull vbox on CI's newtx metrics, say -- could be reported
      # and not diagnosed. The two TeX installations this book builds on
      # paginate differently, so the machine that has to fix such a box is
      # usually not the one that saw it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ matrix.lang }}-${{ matrix.fmt }}
          path: ${{ matrix.job }}.log
          retention-days: 14
          if-no-files-found: warn

      - name: Rename artefact
        run: mv ${{ matrix.job }}.pdf "${{ matrix.pdf }}.pdf"

      - uses: actions/upload-artifact@v4
        with:
          name: book-${{ matrix.lang }}-${{ matrix.fmt }}
          path: ${{ matrix.pdf }}.pdf
          retention-days: 14

      # The WHOLE aux tree, not just the main file. reflist.py follows the
      # \@input{} chain into the per-program aux files, and given only the main
      # one it finds no labels at all -- and reports "0 mismatches", which is a
      # check passing because it read nothing.
      - uses: actions/upload-artifact@v4
        if: always() && matrix.fmt == 'standard'
        with:
          name: aux-${{ matrix.lang }}
          path: |
            main-${{ matrix.lang }}.aux
            programs/${{ matrix.lang }}/*.aux
            appendices/${{ matrix.lang }}/*.aux
          retention-days: 3

  # A \label may resolve to program F8 in one edition and F9 in the other the
  # moment a numbered thing exists in one and not the other. Both builds stay
  # internally consistent and neither warns, so this compares the resolved
  # numbers out of the two .aux files after the fact.
  crossrefs:
    name: Cross-references resolve the same
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v5
        with:
          pattern: aux-*
          merge-multiple: true
      - run: python3 tools/reflist.py main-en.aux main-pl.aux

  ledgers:
    name: Outstanding work
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory. These are counted on every build so the debt is visible rather
    # than quietly carried, but a draft is allowed to carry debt.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Print every ledger
        run: |
          {
            echo "## Outstanding work"
            echo ""
            echo '```'
            make -s debt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
