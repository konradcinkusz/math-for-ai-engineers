name: Pages

# Builds BOTH editions and publishes the PDFs to GitHub Pages, next to the
# two-minute summary page.
#
# Why this workflow builds rather than just uploading docs/: before this, the
# only way to get a PDF was a 14-day CI artefact or a tagged release, so the
# book had no address. Now every push to main leaves the current PDF at a
# stable URL:
#
#   https://konradcinkusz.github.io/math-for-ai-engineers/
#   .../Mathematics-from-Zero-for-the-AI-Engineer.pdf
#   .../Matematyka-od-zera-dla-inzyniera-AI.pdf
#   .../book-en-a4.pdf   .../book-pl-a4.pdf
#
# Four PDFs, not two: the same source in the 17 x 24 cm trade format and on A4.
# The trade format is the one that matches the companion volumes; A4 is the one
# that reads well on a screen and prints on an office printer without landing
# in the middle of the sheet.
#
# It duplicates the compile steps from build.yml deliberately. Pages must never
# publish a PDF that did not build, so it runs the same gate -- checklog.py, not
# `grep '^!'` -- against its own logs rather than trusting another workflow's.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build both editions and publish
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --quiet numpy sympy

      - name: Regenerate every number
        run: make numbers

      - name: Refuse to publish a book whose numbers have drifted
        run: |
          # TWO failures, and `git diff` alone can only see the first: drift in a
          # tracked file, and a file git has NEVER SEEN -- which is the state
          # every program's first values file is in, so it used to pass this
          # gate by being invisible to it.
          #
          # TWO DIRECTORIES, and this was scoped to figures/values alone until
          # F03 added a console transcript. A transcript is a printed number
          # inside a verbatim block: the same promise, the same script, and for
          # one program it sat outside every drift gate in the repository.
          drift=$(git diff --name-only -- figures/values figures/transcripts)
          new=$(git ls-files --others --exclude-standard -- figures/values figures/transcripts)
          if [ -n "$drift" ] || [ -n "$new" ]; then
            echo "::error::A computed value differs from what code/ now produces, or figures/values or figures/transcripts carries a file git has never seen."
            [ -n "$drift" ] && git diff -- figures/values figures/transcripts
            [ -n "$new" ] && { echo "Untracked, never compared to anything:"; echo "$new"; }
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Render diagrams
        run: |
          shopt -s nullglob
          SRC=(figures/mermaid/*/*.mmd)
          [ ${#SRC[@]} -eq 0 ] && exit 0
          printf '{"args":["--no-sandbox","--disable-dev-shm-usage"]}\n' > .puppeteer.json
          for f in "${SRC[@]}"; do
            lang=$(basename "$(dirname "$f")"); key=$(basename "$f" .mmd)
            mkdir -p "figures/diagrams/$lang"
            npx -y @mermaid-js/mermaid-cli@11 \
              -i "$f" -o "figures/diagrams/$lang/$key.pdf" \
              -p .puppeteer.json -c figures/mermaid/config.json \
              -b transparent --pdfFit
          done

      - name: Compile the English edition
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main-en.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Compile the Polish edition
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main-pl.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Compile the English edition on A4
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main-en-a4.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Compile the Polish edition on A4
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main-pl-a4.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      # The same gate the rest of the repository uses. -interaction=nonstopmode
      # writes a PDF over the top of an error and -file-line-error puts a path
      # where `grep '^!'` expects a bang, so a broken build looks green to both.
      - name: Refuse to publish a build that only looked like it worked
        run: |
          python3 tools/checklog.py \
            main-en.log main-pl.log main-en-a4.log main-pl-a4.log
          command -v pdftotext >/dev/null 2>&1 || \
            sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          python3 tools/checkpdf.py --cues=warn \
            main-en.pdf main-pl.pdf main-en-a4.pdf main-pl-a4.pdf

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          cp main-en.pdf "_site/Mathematics-from-Zero-for-the-AI-Engineer.pdf"
          cp main-pl.pdf "_site/Matematyka-od-zera-dla-inzyniera-AI.pdf"
          # A short, stable alias each, so a link in a chat message does not
          # have to carry the whole title.
          cp main-en.pdf _site/book-en.pdf
          cp main-pl.pdf _site/book-pl.pdf
          cp main-en-a4.pdf _site/book-en-a4.pdf
          cp main-pl-a4.pdf _site/book-pl-a4.pdf
          ls -la _site

      - name: Report what was published
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## Published to Pages"
            echo ""
            echo '```'
            python3 tools/checklog.py --summary \
              main-en.log main-pl.log main-en-a4.log main-pl-a4.log || true
            echo '```'
            echo ""
            echo "- \`book-en.pdf\` / \`Mathematics-from-Zero-for-the-AI-Engineer.pdf\`"
            echo "- \`book-pl.pdf\` / \`Matematyka-od-zera-dla-inzyniera-AI.pdf\`"
            echo "- \`book-en-a4.pdf\` / \`book-pl-a4.pdf\` (A4, 12pt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
        with:
          # The very first deploy has no Pages site to look up yet, so
          # configure-pages' "Get Pages site" call 404s and the job fails.
          # enablement: true makes it create the site via the API instead of
          # requiring someone to click it into existence in Settings first.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
